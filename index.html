<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>국어 실전 오답 전수 진단 트래커 PRO (42 MECE)</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #162032;
      --panel-hover: #1e2d45;
      --border: #2a3b54;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-bg: rgba(56, 189, 248, 0.14);
      --danger: #f43f5e;
      --danger-bg: rgba(244, 63, 94, 0.16);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 14px 18px;
      line-height: 1.42;
      font-size: 13px;
    }

    .container {
      max-width: 1520px;
      margin: 0 auto;
    }

    /* Top Bar */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-pro {
      font-size: 0.7rem;
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .title-group p {
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    input[type="text"], select {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.12s ease;
      font-weight: 600;
    }

    button:hover {
      background: var(--panel-hover);
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b1120;
    }

    button.danger:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Session & Quick Log Bar */
    .CommandBar {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (max-width: 1024px) {
      .CommandBar {
        grid-template-columns: 1fr;
      }
    }

    .bar-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .bar-label {
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--accent);
      white-space: nowrap;
    }

    .bar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    /* Dashboard Summary */
    .dashboard {
      display: grid;
      grid-template-columns: 270px 1fr 340px;
      gap: 12px;
      margin-bottom: 14px;
    }

    @media (max-width: 1180px) {
      .dashboard {
        grid-template-columns: 260px 1fr;
      }
      .log-card {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 760px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-card h2 {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-big {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }

    .cat-bars {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .cat-bar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
    }

    .cat-bar-label {
      width: 92px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-bar-track {
      flex: 1;
      height: 6px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden;
    }

    .cat-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }

    .cat-bar-val {
      width: 22px;
      text-align: right;
      font-weight: 700;
    }

    /* Top Weaknesses */
    .top-weakness-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .weakness-item {
      background: rgba(11, 17, 32, 0.65);
      border: 1px solid var(--border);
      border-left: 3px solid var(--danger);
      border-radius: 5px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .weakness-title {
      font-weight: 700;
      font-size: 0.82rem;
      color: #fda4af;
    }

    .weakness-action {
      font-size: 0.76rem;
      color: var(--text);
      margin-top: 2px;
    }

    .weakness-action strong {
      color: var(--accent);
    }

    .weakness-badge {
      background: var(--danger-bg);
      color: var(--danger);
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    /* Question History Log */
    .q-log-list {
      max-height: 185px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 2px;
    }

    .q-log-item {
      background: rgba(11, 17, 32, 0.55);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 0.76rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .q-log-tags {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--danger);
      font-weight: 700;
    }

    .q-del-btn {
      padding: 1px 5px;
      font-size: 0.7rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
    }

    .q-del-btn:hover {
      color: var(--danger);
    }

    .empty-state {
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 16px 0;
      text-align: center;
    }

    /* Filter & Tabs */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    /* Checklist Grid */
    .category-section {
      margin-bottom: 18px;
    }

    .category-header {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 8px;
    }

    @media (max-width: 480px) {
      .items-grid {
        grid-template-columns: 1fr;
      }
    }

    .item-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .item-card.has-count {
      border-color: rgba(244, 63, 94, 0.6);
      background: linear-gradient(180deg, rgba(244, 63, 94, 0.07) 0%, var(--panel) 100%);
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .code-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 800;
      font-size: 0.76rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-bg);
      color: var(--accent);
      white-space: nowrap;
    }

    .item-card.has-count .code-badge {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .item-title {
      font-weight: 700;
      font-size: 0.85rem;
      flex: 1;
      color: var(--text);
    }

    .counter-box {
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--bg);
      padding: 1px 4px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .cnt-btn {
      padding: 1px 6px;
      font-size: 0.82rem;
      font-weight: 800;
      border: none;
      background: transparent;
      color: var(--text-muted);
    }

    .cnt-btn:hover:not(:disabled) {
      color: var(--text);
      background: var(--panel);
    }

    .cnt-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .cnt-val {
      min-width: 20px;
      text-align: center;
      font-weight: 800;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .item-card.has-count .cnt-val {
      color: var(--danger);
    }

    .item-desc {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .item-prescription {
      font-size: 0.75rem;
      background: rgba(11, 17, 32, 0.55);
      padding: 5px 7px;
      border-radius: 4px;
      border-left: 2px solid var(--accent);
      color: #cbd5e1;
    }

    .item-prescription strong {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1>국어 실전 오답 전수 진단 트래커 <span class="badge-pro">42 MECE PRO</span></h1>
        <p>회차별 기록 분리 · 전체 누적 통계(ALL) · 문항 2중 태깅 빠른 입력 · CSV/JSON 백업 지원</p>
      </div>
      <div class="controls">
        <button onclick="exportSummary()">처방전 텍스트 복사</button>
        <button onclick="exportCSV()">CSV 내보내기</button>
        <button onclick="exportJSON()">JSON 백업</button>
        <button onclick="document.getElementById('jsonImportInput').click()">JSON 복원</button>
        <input type="file" id="jsonImportInput" accept=".json" style="display:none" onchange="importJSON(event)">
        <button class="danger" onclick="resetCurrentSession()">현재 회차 초기화</button>
      </div>
    </header>

    <!-- 회차 관리 및 빠른 태깅 바 -->
    <section class="CommandBar">
      <div class="bar-card">
        <span class="bar-label">모의고사 회차 선택</span>
        <div class="bar-group">
          <select id="sessionSelect" onchange="changeSession(this.value)" style="flex:1; min-width:170px;"></select>
          <input type="text" id="newSessionName" placeholder="새 회차명 (예: 9평, 이감 4회)" style="width:165px;" onkeydown="if(event.key==='Enter') createSession()">
          <button class="primary" onclick="createSession()">+ 회차 추가</button>
          <button class="danger" id="delSessionBtn" onclick="deleteCurrentSession()">삭제</button>
        </div>
      </div>

      <div class="bar-card">
        <span class="bar-label">빠른 2중 태깅 입력</span>
        <div class="bar-group">
          <input type="text" id="qNumInput" placeholder="문항 (예: 14)" style="width:85px;" onkeydown="if(event.key==='Enter') quickAddTag()">
          <input type="text" id="qCodesInput" placeholder="코드 (예: A4 B6)" style="width:125px; text-transform:uppercase;" onkeydown="if(event.key==='Enter') quickAddTag()">
          <input type="text" id="qMemoInput" placeholder="한줄 메모 (선택: 선지 4번 역전)" style="flex:1; min-width:130px;" onkeydown="if(event.key==='Enter') quickAddTag()">
          <button class="primary" id="quickAddBtn" onclick="quickAddTag()">기록 (Enter)</button>
        </div>
      </div>
    </section>

    <!-- 상단 3열 대시보드 -->
    <section class="dashboard">
      <div class="stat-card">
        <div>
          <h2><span id="statScopeTitle">현재 회차 오답 태깅</span> <span id="activeTypesCount">0 / 42 유형</span></h2>
          <div class="stat-big" id="totalCount">0회</div>
        </div>
        <div class="cat-bars" id="catBars"></div>
      </div>

      <div class="stat-card">
        <h2><span>최우선 교정 타겟 (Top 5 취약점 & If-Then 행동 강령)</span> <span>시험 직전 필독</span></h2>
        <div id="topWeaknessContainer" class="top-weakness-list"></div>
      </div>

      <div class="stat-card log-card">
        <h2><span>문항별 오답 태깅 기록</span> <span id="qLogCount">0건</span></h2>
        <div id="qLogContainer" class="q-log-list"></div>
      </div>
    </section>

    <!-- 탭 및 검색 필터 -->
    <div class="filter-row">
      <nav class="tabs" id="categoryTabs"></nav>
      <div class="controls">
        <input type="text" id="searchInput" placeholder="코드(A4, C3) 또는 키워드 검색 ( / 키)" style="width:210px;" oninput="render()">
        <button id="filterActiveBtn" onclick="toggleActiveFilter()">누적 오답만 보기</button>
      </div>
    </div>

    <!-- 메인 42항목 그리드 -->
    <main id="checklistContainer"></main>
  </div>

  <script>
    const ERROR_DATA = [
      // A. 독서: 지문 독해 오류 (10)
      { id: "A1", cat: "A. 독서: 지문 독해", title: "개념 정의 및 범주(포함 관계) 누락", desc: "A는 B의 하위 개념인데 대등하거나 반대로 묶음", action: "개념 첫 등장 시 밑줄, 상하 포함 관계는 여백에 기호(⊂)로 즉시 구조화" },
      { id: "A2", cat: "A. 독서: 지문 독해", title: "비교/대조(공통점·차이점) 매칭 혼동", desc: "관점/대상 A와 B의 속성을 머릿속에서 뒤섞어 기억함", action: "비교 대상은 ○, △로 표기 고정하고 차이점이 갈리는 '척도(기준)'에 별표" },
      { id: "A3", cat: "A. 독서: 지문 독해", title: "인과/선후/비례 관계 역전 독해", desc: "원인↔결과, 선↔후, 비례↔반비례 방향을 반대로 읽음", action: "텍스트로만 읽지 말고 지문 여백에 화살표(↑, ↓, →)로 메커니즘 시각화" },
      { id: "A4", cat: "A. 독서: 지문 독해", title: "예외 및 제한 조건절 스킵", desc: "'단, ~일 때만', '~를 제외하고' 등 조건 표지를 흘려 읽음", action: "제한·예외 표지어 등장 시 무조건 네모 박스(□)를 크게 치고 1순위 출제 포인트로 인식" },
      { id: "A5", cat: "A. 독서: 지문 독해", title: "지시어·접속어 문맥 연결 실패", desc: "'이처럼', '그러므로', '이러한'이 가리키는 앞 문장 핵심을 놓침", action: "지시어를 만나면 반드시 앞 문장의 어떤 구절을 받는지 화살표로 연결 후 전진" },
      { id: "A6", cat: "A. 독서: 지문 독해", title: "마지막 문단(후반부) 날림 독해", desc: "시간 압박으로 지문 끝부분의 추가 정보나 의의/한계를 튕김", action: "마지막 문단에서 최소 선지 2개가 출제됨을 의식하고 마지막 5줄에서 호흡 늦추기" },
      { id: "A7", cat: "A. 독서: 지문 독해", title: "생략된 전제 및 행간(대우 명제) 추론 실패", desc: "지문에 직접 안 적혔지만 논리상 당연한 귀결을 '없는 내용'이라 착각함", action: "'A이면 B이다'가 나오면 'B가 아니면 A가 아니다(대우)'와 반대 케이스를 동시에 생각" },
      { id: "A8", cat: "A. 독서: 지문 독해", title: "산술 수식·비율·그래프(도표) 연동 오류", desc: "분모/분자 증감, 변화율과 절댓값, 그래프 축(X,Y)을 잘못 매칭함", action: "비율(A/B)은 여백에 분수 형태로 직접 적고, 그래프는 가로축·세로축 이름부터 동그라미" },
      { id: "A9", cat: "A. 독서: 지문 독해", title: "(가)/(나) 주제 통합 지문 간 관점 교차 실패", desc: "(가)의 입장에서 (나)를 비판하거나 공통 화제를 찾는 연결고리 누락", action: "(가) 독해 직후 핵심 논지 한 줄 요약 후, (나)를 읽으며 (가)와 대립하는 지점에 체크" },
      { id: "A10", cat: "A. 독서: 지문 독해", title: "다층적 조건 분기(Case by Case) 시뮬레이션 누락", desc: "법·경제·기술에서 조건 A, B, C 조합에 따른 다중 분기(If-Else) 케이스를 놓침", action: "조건이 2개 이상 겹치면 머리로만 처리하지 말고 여백에 간단한 경우의 수 표(Matrix) 작성" },

    const VALID_IDS = new Set(ERROR_DATA.map(d => d.id));
    const STORAGE_KEY_PRO = "korean_error_tracker_pro_v42";
    const LEGACY_KEY = "korean_error_tracker_v42";

    let appState = loadInitialState();
    let currentCategory = "ALL";
    let showOnlyActive = false;

    function loadInitialState() {
      const saved = localStorage.getItem(STORAGE_KEY_PRO);
      if (saved) {
        try { return JSON.parse(saved); } catch (e) {}
      }
      // 이전 단일 버전 데이터가 있으면 1회차로 자동 마이그레이션
      const legacy = localStorage.getItem(LEGACY_KEY);
      let initialCounts = {};
      if (legacy) {
        try { initialCounts = JSON.parse(legacy); } catch (e) {}
      }
      return {
        activeSessionId: "s_default",
        sessions: [
          {
            id: "s_default",
            name: "1회차 (기본 기록)",
            date: new Date().toISOString().slice(0, 10),
            counts: initialCounts,
            logs: []
          }
        ]
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY_PRO, JSON.stringify(appState));
      render();
    }

    function getCurrentSession() {
      return appState.sessions.find(s => s.id === appState.activeSessionId) || null;
    }

    function getAggregatedCounts() {
      if (appState.activeSessionId === "ALL_SESSIONS") {
        const totalCounts = {};
        appState.sessions.forEach(s => {
          Object.entries(s.counts || {}).forEach(([k, v]) => {
            totalCounts[k] = (totalCounts[k] || 0) + v;
          });
        });
        return totalCounts;
      }
      const s = getCurrentSession();
      return s ? (s.counts || {}) : {};
    }

    function changeSession(val) {
      appState.activeSessionId = val;
      saveState();
    }

    function createSession() {
      const input = document.getElementById("newSessionName");
      const name = input.value.trim();
      if (!name) {
        alert("새 모의고사 회차 이름을 입력해 주세요. (예: 27학년도 6평, 이감 3회)");
        return;
      }
      const newId = "s_" + Date.now();
      appState.sessions.push({
        id: newId,
        name: name,
        date: new Date().toISOString().slice(0, 10),
        counts: {},
        logs: []
      });
      appState.activeSessionId = newId;
      input.value = "";
      saveState();
    }

    function deleteCurrentSession() {
      if (appState.activeSessionId === "ALL_SESSIONS") {
        alert("전체 누적 합산 뷰에서는 회차를 삭제할 수 없습니다. 개별 회차를 선택해 주세요.");
        return;
      }
      if (appState.sessions.length <= 1) {
        alert("최소 1개의 회차는 남아 있어야 합니다. 내용을 비우려면 [현재 회차 초기화]를 눌러주세요.");
        return;
      }
      const cur = getCurrentSession();
      if (confirm(`[${cur.name}] 회차 기록을 완전히 삭제할까요?`)) {
        appState.sessions = appState.sessions.filter(s => s.id !== cur.id);
        appState.activeSessionId = appState.sessions[appState.sessions.length - 1].id;
        saveState();
      }
    }

    function resetCurrentSession() {
      if (appState.activeSessionId === "ALL_SESSIONS") {
        if (confirm("모든 회차의 전체 데이터를 초기화할까요?")) {
          appState.sessions.forEach(s => { s.counts = {}; s.logs = []; });
          saveState();
        }
        return;
      }
      const cur = getCurrentSession();
      if (cur && confirm(`[${cur.name}] 회차의 카운트와 문항 기록을 초기화할까요?`)) {
        cur.counts = {};
        cur.logs = [];
        saveState();
      }
    }

    function updateCount(id, delta) {
      if (appState.activeSessionId === "ALL_SESSIONS") {
        alert("전체 누적 합산(ALL) 모드에서는 개별 카운트를 직접 수정할 수 없습니다. 상단에서 기록할 회차를 선택해 주세요.");
        return;
      }
      const cur = getCurrentSession();
      if (!cur) return;
      const current = cur.counts[id] || 0;
      const next = Math.max(0, current + delta);
      if (next === 0) {
        delete cur.counts[id];
      } else {
        cur.counts[id] = next;
      }
      saveState();
    }

    function quickAddTag() {
      if (appState.activeSessionId === "ALL_SESSIONS") {
        alert("기록할 모의고사 회차를 먼저 선택해 주세요.");
        return;
      }
      const cur = getCurrentSession();
      const qNum = document.getElementById("qNumInput").value.trim() || "-";
      const rawCodes = document.getElementById("qCodesInput").value.toUpperCase();
      const memo = document.getElementById("qMemoInput").value.trim();

      const parsedCodes = rawCodes.split(/[\s,+]+/).filter(Boolean);
      if (parsedCodes.length === 0) {
        alert("오답 코드를 1개 이상 입력해 주세요. (예: A4 B6)");
        return;
      }

      const invalid = parsedCodes.filter(c => !VALID_IDS.has(c));
      if (invalid.length > 0) {
        alert(`존재하지 않는 코드입니다: ${invalid.join(", ")}\n(A1~A10, B1~B9, C1~C11, D1~D6, E1~E6 중 입력)`);
        return;
      }

      parsedCodes.forEach(code => {
        cur.counts[code] = (cur.counts[code] || 0) + 1;
      });

      cur.logs = cur.logs || [];
      cur.logs.unshift({
        id: "log_" + Date.now(),
        qNum,
        codes: parsedCodes,
        memo
      });

      document.getElementById("qNumInput").value = "";
      document.getElementById("qCodesInput").value = "";
      document.getElementById("qMemoInput").value = "";
      document.getElementById("qNumInput").focus();
      saveState();
    }

    function removeLog(sessionId, logId) {
      const targetSession = appState.sessions.find(s => s.id === sessionId);
      if (!targetSession || !targetSession.logs) return;
      const idx = targetSession.logs.findIndex(l => l.id === logId);
      if (idx === -1) return;

      const logItem = targetSession.logs[idx];
      logItem.codes.forEach(code => {
        if (targetSession.counts[code]) {
          targetSession.counts[code] = Math.max(0, targetSession.counts[code] - 1);
          if (targetSession.counts[code] === 0) delete targetSession.counts[code];
        }
      });

      targetSession.logs.splice(idx, 1);
      saveState();
    }

    function setCategory(cat) {
      currentCategory = cat;
      render();
    }

    function toggleActiveFilter() {
      showOnlyActive = !showOnlyActive;
      document.getElementById("filterActiveBtn").classList.toggle("active", showOnlyActive);
      render();
    }

    // Export / Import
    function exportSummary() {
      const counts = getAggregatedCounts();
      const scopeName = appState.activeSessionId === "ALL_SESSIONS" ? "전체 회차 누적" : getCurrentSession().name;
      const activeItems = ERROR_DATA
        .filter(item => (counts[item.id] || 0) > 0)
        .sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0));

      if (activeItems.length === 0) {
        alert("체크된 오답 항목이 없습니다.");
        return;
      }

      let text = `=== [국어 실전 오답 리포트 : ${scopeName}] ===\n`;
      activeItems.forEach((item, idx) => {
        text += `${idx + 1}. [${item.id}] ${item.title} (${counts[item.id]}회)\n   ↳ If-Then 처방: ${item.action}\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        alert("현재 뷰의 취약점 리포트와 처방전이 클립보드에 복사되었습니다!");
      });
    }

    function exportCSV() {
      let rows = [["회차명", "날짜", "오답코드", "영역", "오답유형명", "누적횟수", "실전행동강령"]];
      appState.sessions.forEach(s => {
        ERROR_DATA.forEach(item => {
          const cnt = (s.counts && s.counts[item.id]) || 0;
          if (cnt > 0) {
            rows.push([
              s.name,
              s.date || "",
              item.id,
              item.cat,
              item.title,
              cnt,
              item.action
            ]);
          }
        });
      });

      if (rows.length === 1) {
        alert("내보낼 오답 기록이 없습니다.");
        return;
      }

      const csvContent = "\uFEFF" + rows.map(r => r.map(field => `"${String(field).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `국어_오답트래커_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportJSON() {
      const dataStr = JSON.stringify(appState, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `korean_error_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && Array.isArray(parsed.sessions)) {
            appState = parsed;
            saveState();
            alert("JSON 백업 데이터가 성공적으로 복원되었습니다.");
          } else {
            alert("유효한 백업 파일 형식이 아닙니다.");
          }
        } catch (err) {
          alert("파일을 읽는 중 오류가 발생했습니다.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    // Rendering
    function renderSessionSelector() {
      const sel = document.getElementById("sessionSelect");
      const isAll = appState.activeSessionId === "ALL_SESSIONS";

      let html = `<option value="ALL_SESSIONS" ${isAll ? "selected" : ""}>📊 전체 누적 합산 (${appState.sessions.length}개 회차)</option>`;
      appState.sessions.forEach(s => {
        const total = Object.values(s.counts || {}).reduce((a, b) => a + b, 0);
        const selected = s.id === appState.activeSessionId ? "selected" : "";
        html += `<option value="${s.id}" ${selected}>📝 ${s.name} (${total}회)</option>`;
      });
      sel.innerHTML = html;

      document.getElementById("delSessionBtn").disabled = isAll;
      document.getElementById("quickAddBtn").disabled = isAll;
    }

    function renderDashboard() {
      const counts = getAggregatedCounts();
      const isAll = appState.activeSessionId === "ALL_SESSIONS";
      const curSession = getCurrentSession();

      document.getElementById("statScopeTitle").textContent = isAll ? "전체 회차 누적 태깅" : `[${curSession.name}] 태깅`;

      let total = 0;
      let activeTypes = 0;
      const catTotals = {};

      ERROR_DATA.forEach(item => {
        const c = counts[item.id] || 0;
        total += c;
        if (c > 0) activeTypes++;
        catTotals[item.cat] = (catTotals[item.cat] || 0) + c;
      });

      document.getElementById("totalCount").textContent = `${total}회`;
      document.getElementById("activeTypesCount").textContent = `${activeTypes} / 42개 유형`;

      // Category bars
      const catBarsEl = document.getElementById("catBars");
      const uniqueCats = [...new Set(ERROR_DATA.map(d => d.cat))];
      catBarsEl.innerHTML = uniqueCats.map(cat => {
        const val = catTotals[cat] || 0;
        const pct = total > 0 ? Math.round((val / total) * 100) : 0;
        return `
          <div class="cat-bar-row">
            <span class="cat-bar-label" title="${cat}">${cat}</span>
            <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%"></div></div>
            <span class="cat-bar-val">${val}</span>
          </div>
        `;
      }).join("");

      // Top 5 Weaknesses
      const topContainer = document.getElementById("topWeaknessContainer");
      const sorted = ERROR_DATA
        .filter(item => (counts[item.id] || 0) > 0)
        .sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0))
        .slice(0, 5);

      if (sorted.length === 0) {
        topContainer.innerHTML = `<div class="empty-state">상단 <strong>빠른 2중 태깅 입력</strong>을 쓰거나 아래 카드에서 <strong>[+]</strong>를 누르면 Top 5 취약점과 처방전이 표시됩니다.</div>`;
      } else {
        topContainer.innerHTML = sorted.map(item => `
          <div class="weakness-item">
            <div>
              <div class="weakness-title">[${item.id}] ${item.title}</div>
              <div class="weakness-action"><strong>실전 행동 강령:</strong> ${item.action}</div>
            </div>
            <div class="weakness-badge">${counts[item.id]}회</div>
          </div>
        `).join("");
      }

      // Question Log
      const logContainer = document.getElementById("qLogContainer");
      let logsToRender = [];
      if (isAll) {
        appState.sessions.forEach(s => {
          (s.logs || []).forEach(l => logsToRender.push({ ...l, sessionId: s.id, sessionName: s.name }));
        });
      } else if (curSession && curSession.logs) {
        logsToRender = curSession.logs.map(l => ({ ...l, sessionId: curSession.id, sessionName: curSession.name }));
      }

      document.getElementById("qLogCount").textContent = `${logsToRender.length}건`;
      if (logsToRender.length === 0) {
        logContainer.innerHTML = `<div class="empty-state">문항 번호와 코드를 입력하면 문항별 오답 기록이 이곳에 남습니다.</div>`;
      } else {
        logContainer.innerHTML = logsToRender.map(l => `
          <div class="q-log-item">
            <div>
              <strong>${isAll ? `[${l.sessionName}] ` : ""}${l.qNum}번</strong>
              <span class="q-log-tags">[${l.codes.join(" + ")}]</span>
              ${l.memo ? `<span style="color:var(--text-muted); margin-left:4px;">- ${l.memo}</span>` : ""}
            </div>
            <button class="q-del-btn" title="기록 삭제 및 카운트 차감" onclick="removeLog('${l.sessionId}', '${l.id}')">✕</button>
          </div>
        `).join("");
      }
    }

    function renderTabs() {
      const uniqueCats = ["ALL", ...new Set(ERROR_DATA.map(d => d.cat))];
      const tabsEl = document.getElementById("categoryTabs");
      tabsEl.innerHTML = uniqueCats.map(cat => {
        const label = cat === "ALL" ? "전체 (42)" : cat;
        const activeClass = currentCategory === cat ? "active" : "";
        return `<button class="${activeClass}" onclick="setCategory('${cat}')">${label}</button>`;
      }).join("");
    }

    function renderChecklist() {
      const counts = getAggregatedCounts();
      const isAll = appState.activeSessionId === "ALL_SESSIONS";
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const container = document.getElementById("checklistContainer");
      const uniqueCats = [...new Set(ERROR_DATA.map(d => d.cat))];

      let html = "";

      uniqueCats.forEach(cat => {
        if (currentCategory !== "ALL" && currentCategory !== cat) return;

        const filteredItems = ERROR_DATA.filter(item => {
          if (item.cat !== cat) return false;
          const cnt = counts[item.id] || 0;
          if (showOnlyActive && cnt === 0) return false;
          if (query) {
            return (
              item.id.toLowerCase().includes(query) ||
              item.title.toLowerCase().includes(query) ||
              item.desc.toLowerCase().includes(query) ||
              item.action.toLowerCase().includes(query)
            );
          }
          return true;
        });

        if (filteredItems.length === 0) return;

        html += `
          <section class="category-section">
            <div class="category-header">
              <span>${cat}</span>
              <span style="font-size:0.76rem; color:var(--text-muted); font-weight:600;">${filteredItems.length}개 항목</span>
            </div>
            <div class="items-grid">
              ${filteredItems.map(item => {
                const cnt = counts[item.id] || 0;
                const activeCardClass = cnt > 0 ? "has-count" : "";
                return `
                  <div class="item-card ${activeCardClass}">
                    <div>
                      <div class="item-top">
                        <span class="code-badge">${item.id}</span>
                        <div class="item-title">${item.title}</div>
                        <div class="counter-box">
                          <button class="cnt-btn" ${isAll ? "disabled" : ""} onclick="updateCount('${item.id}', -1)">-</button>
                          <span class="cnt-val">${cnt}</span>
                          <button class="cnt-btn" ${isAll ? "disabled" : ""} onclick="updateCount('${item.id}', 1)">+</button>
                        </div>
                      </div>
                      <div class="item-desc" style="margin-top:4px;">• <strong>오답 상황:</strong> ${item.desc}</div>
                    </div>
                    <div class="item-prescription">
                      <strong>If-Then 처방:</strong> ${item.action}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </section>
        `;
      });

      container.innerHTML = html || `<div class="empty-state">검색 조건에 맞는 오답 항목이 없습니다.</div>`;
    }

    function render() {
      renderSessionSelector();
      renderDashboard();
      renderTabs();
      renderChecklist();
    }

    // 단축키: '/' 누르면 검색창 포커스
    window.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
        e.preventDefault();
        document.getElementById("searchInput").focus();
      }
    });

    render();
  </script>
</body>
</html>
